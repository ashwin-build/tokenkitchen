services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tokenkitchen
      POSTGRES_USER: tokenkitchen
      POSTGRES_PASSWORD: tokenkitchen
    ports:
      - "5433:5432"
    volumes:
      - tokenkitchen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenkitchen -d tokenkitchen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tokenkitchen-postgres: