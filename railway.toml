# Railway deployment

This project deploys as one web service plus one managed PostgreSQL service. Railway detects the root `Dockerfile`; `railway.toml` then runs database migrations before each release and requires `GET /api/health` to pass before the release becomes active.

## Create the services

1. Push this folder to a private GitHub repository. Do not commit `.env` or any credentials.
2. In Railway, create an empty project and add **PostgreSQL**. Leave the database private.
3. Add a GitHub service from the repository. Railway will use the checked-in Dockerfile.
4. In the web service, generate a public Railway domain temporarily. Use its HTTPS URL for `NEXT_PUBLIC_APP_URL` until your custom domain is connected.

## Configure web-service variables

In the web service's **Variables** tab, create the following reference variable. Replace `Postgres` if you name the database service differently:

```text
DATABASE_URL=${{Postgres.DATABASE_URL}}
```

Add these values as sealed variables in the Railway dashboard. They must be present before the first deployment; the application will refuse to start without them.

```text
NODE_ENV=production
NEXT_PUBLIC_APP_URL=https://your-domain.example
NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_live_...
CLERK_SECRET_KEY=sk_live_...
RAZORPAY_KEY_ID=rzp_live_...
RAZORPAY_KEY_SECRET=...
RAZORPAY_WEBHOOK_SECRET=...
SELLER_NAME=Your registered business name
SELLER_ADDRESS=Your registered business address
SELLER_GSTIN=Your GSTIN
```

## First release

1. Deploy the web service. Railway runs `npm run db:deploy` before starting the image.
2. Confirm the deployment becomes active only after `/api/health` returns HTTP 200.
3. Set the same final HTTPS domain in Clerk's allowed origins and redirect URLs.
4. In Razorpay, create a webhook for `https://your-domain.example/api/webhooks/razorpay`, subscribe it to the payment events used by the application, and set its signing secret as `RAZORPAY_WEBHOOK_SECRET`.
5. Make a real payment in a staging tenant before accepting customer payments.

## Operations

- Keep the PostgreSQL service private; the app connects through Railway's internal `DATABASE_URL` reference.
- Enable Railway database backups and test restoring one before launch.
- Configure a monthly usage alert and review logs and database capacity weekly during the first month.
- Railway configuration-as-code is currently marked deprecated by Railway for after 2026-12-01. Before then, migrate the settings in `railway.toml` to Railway IaC or retain the equivalent dashboard settings.
