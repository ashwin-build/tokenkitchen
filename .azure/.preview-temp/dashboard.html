<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenKitchen Dashboard</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">TK</div>
          <span>TokenKitchen</span>
        </div>
        <nav class="nav">
          <a href="#">Dashboard</a>
          <a href="#">Orders</a>
          <a href="#">Catalog</a>
          <a href="#">Billing</a>
        </nav>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="section">
            <div class="label">Workspace</div>
            <button class="active">Overview</button>
            <button>Orders</button>
            <button>Inventory</button>
            <button>Billing</button>
          </div>
          <div class="section">
            <div class="label">Reports</div>
            <button>Daily sales</button>
            <button>GST</button>
            <button>Khata</button>
          </div>
        </aside>

        <main class="content">
          <section class="summary-grid">
            <div class="card metric">
              <div class="kicker">Today sales</div>
              <div class="value">₹34,250</div>
            </div>
            <div class="card metric">
              <div class="kicker">Queued orders</div>
              <div class="value">28</div>
            </div>
            <div class="card metric">
              <div class="kicker">Low stock</div>
              <div class="value">6 items</div>
            </div>
            <div class="card metric">
              <div class="kicker">Open credits</div>
              <div class="value">₹4,120</div>
            </div>
          </section>

          <section class="card panel">
            <h3>Live kitchen queue</h3>
            <table class="table">
              <thead>
                <tr><th>Order #</th><th>Table</th><th>Item</th><th>Status</th></tr>
              </thead>
              <tbody>
                <tr><td>#1042</td><td>8</td><td>Butter Chicken, Naan</td><td><span class="badge success">Ready</span></td></tr>
                <tr><td>#1045</td><td>12</td><td>Veg Thali, Masala Tea</td><td><span class="badge warning">Cooking</span></td></tr>
                <tr><td>#1048</td><td>3</td><td>Tandoori Momos, Coke</td><td><span class="badge danger">Queued</span></td></tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
