<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenKitchen Catalog</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">TK</div><span>Catalog</span></div>
        <nav class="nav"><a href="#">Dashboard</a><a href="#">Orders</a><a href="#">Catalog</a></nav>
      </header>
      <div class="layout">
        <aside class="sidebar">
          <div class="section">
            <div class="label">Catalog</div>
            <button class="active">Ingredients</button>
            <button>Dishes</button>
            <button>Recipes</button>
            <button>Supplier</button>
          </div>
        </aside>
        <main class="content">
          <section class="card panel">
            <h3>Ingredient inventory</h3>
            <table class="table">
              <thead>
                <tr><th>Ingredient</th><th>Unit</th><th>Stock</th><th>Reorder</th><th>Cost</th></tr>
              </thead>
              <tbody>
                <tr><td>Onion</td><td>kg</td><td>18.5</td><td>8</td><td>₹42</td></tr>
                <tr><td>Chicken</td><td>kg</td><td>6.2</td><td>5</td><td>₹210</td></tr>
                <tr><td>Rice</td><td>kg</td><td>24</td><td>10</td><td>₹38</td></tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
