<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenKitchen Orders</title>
    <link rel="stylesheet" href="./theme.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><div class="brand-mark">TK</div><span>Orders</span></div>
        <nav class="nav"><a href="#">Dashboard</a><a href="#">Orders</a><a href="#">Catalog</a></nav>
      </header>
      <div class="layout">
        <aside class="sidebar">
          <div class="section">
            <div class="label">Filters</div>
            <button class="active">All</button>
            <button>Queued</button>
            <button>Cooking</button>
            <button>Ready</button>
          </div>
        </aside>
        <main class="content">
          <section class="card panel">
            <h3>Queue and payment status</h3>
            <table class="table">
              <thead>
                <tr><th>Token</th><th>Item</th><th>ETA</th><th>Kitchen stage</th><th>Payment</th></tr>
              </thead>
              <tbody>
                <tr><td>27</td><td>Paneer Roll</td><td>6 min</td><td><span class="badge warning">Grill</span></td><td>Paid</td></tr>
                <tr><td>28</td><td>Veg Biryani</td><td>9 min</td><td><span class="badge danger">Prep</span></td><td>UPI</td></tr>
                <tr><td>29</td><td>Cold Coffee</td><td>3 min</td><td><span class="badge success">Pickup</span></td><td>Cash</td></tr>
              </tbody>
            </table>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
