name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tokenkitchen
          POSTGRES_USER: tokenkitchen
          POSTGRES_PASSWORD: tokenkitchen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tokenkitchen -d tokenkitchen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tokenkitchen:tokenkitchen@localhost:5432/tokenkitchen?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build